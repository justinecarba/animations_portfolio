<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gear 5 | Grand Line Login</title>

    <!-- Connect external CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Anime-style fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>

  <body>
    <div class="login-container">
      <div class="logo">ONE PIECE</div>

      <h1>GRAND LINE</h1>

      <p class="subtitle">WELCOME, PIRATE</p>

      <div class="title-divider">
        <span></span>
        <b>LOG IN</b>
        <span></span>
      </div>

      <form>
        <div class="input-group">
          <label for="username">NAME</label>

          <input
            id="username"
            type="text"
            placeholder="Enter your username"
            required />
        </div>

        <div class="input-group">
          <label for="bounty">BOUNTY</label>

          <input
            id="username"
            type="text"
            placeholder="Enter your bounty berry $"
            required />
        </div>

        <div class="input-group">
          <label for="password">PASSKEY</label>

          <input
            id="password"
            type="password"
            placeholder="Enter your passkey"
            required />
        </div>

        <div class="remember">
          <label class="remember-option">
            <input type="checkbox" />
            <span>Remember me</span>
          </label>

          <a href="#" class="forgot">Forgot Password?</a>
        </div>

        <button type="submit">SET SAIL</button>

        <div class="divider">
          <span></span>
          <b>OR</b>
          <span></span>
        </div>

        <div class="links">
          <p>Don't have an account?</p>

          <a href="#">JOIN THE CREW</a>
        </div>

        <div class="back-home">
          <a href="#">BACK TO HOME</a>
        </div>
      </form>

      <div class="footer">
        <p>SUN GOD NIKA</p>

        <span>FIND THE ONE PIECE</span>
      </div>
    </div>
  </body>
</html>
